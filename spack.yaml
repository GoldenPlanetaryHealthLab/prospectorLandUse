# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  # add package specs to the `specs` list
  specs:
  - r@4.5.1
  - r-terra
  - r-sf
  - r-exactextractr
  - python
  - neovim
  - gdal
  - geos
  - proj
  - sqlite
  - curl
  - git
  - cmake
  - gmake
  - abseil-cpp
  - openssl
  - udunits
  - libxml2
  - libuv
  view: true
  concretizer:
    unify: when_possible
